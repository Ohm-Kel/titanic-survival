[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-survival"
version = "0.1.0"
description = "Titanic survival prediction with leakage-safe scikit-learn pipelines"
readme = "README.md"
license = "MIT"
authors = [{ name = "Semanu Kwaku Sebuava" }]
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "kaggle"]

[project.scripts]
titanic-experiments = "titanic.experiments:main"
titanic-train = "titanic.train:main"
titanic-predict = "titanic.predict:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88